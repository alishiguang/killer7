[package]
name = "chuaker7"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "chuaker7 — macOS 系统工具箱（SwiftUI 原版 LuciBox 的 Rust 重写）"
authors = ["chuaker7 <chuaker7@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/chuaker7/chuaker7"
readme = "README.md"
keywords = ["macos", "toolbox", "egui", "system-monitor", "process-manager"]
categories = ["gui", "os::macos-apis"]

[dependencies]
# GUI
eframe = "0.33"
egui = "0.33"
egui_extras = "0.33"
# 系统能力
arboard = "3.7"
sysinfo = "0.38"
tray-icon = "0.26"
global-hotkey = "0.10"
notify = "8.2"
trash = "5.4"
open = "5.4"
# 通用
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
anyhow = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
